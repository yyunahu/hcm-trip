<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>胡志明 12/1–12/5</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#12302b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="胡志明">
<style>
:root{--bg:#f1f6f3;--card:#fff;--ink:#12302b;--mute:#5d726d;--line:#cfdcd7;--acc:#c2255c;--warn:#b7791f;--warnbg:#fbf1da;--ok:#1f7a5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1f1c;--card:#16302b;--ink:#e6f1ed;--mute:#9ab3ac;--line:#2b4a43;--acc:#f06595;--warn:#f0c36a;--warnbg:#3a2f14;--ok:#5fd0a6}}
:root[data-theme="dark"]{--bg:#0e1f1c;--card:#16302b;--ink:#e6f1ed;--mute:#9ab3ac;--line:#2b4a43;--acc:#f06595;--warn:#f0c36a;--warnbg:#3a2f14;--ok:#5fd0a6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{padding:28px 20px 16px;max-width:640px;margin:0 auto}
h1{margin:0;font-size:2.4rem;line-height:1.1;letter-spacing:.04em;font-weight:800}
.sub{color:var(--mute);margin:6px 0 0}
.count{display:inline-block;margin-top:14px;padding:4px 14px;border-radius:99px;background:var(--acc);color:#fff;font-weight:700}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:8px 12px;scrollbar-width:none}
nav button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:99px;margin-right:6px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav button:focus-visible,li.chk:focus-within{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h2{font-size:1.25rem;margin:0 0 4px}
.date{color:var(--mute);margin:0 0 14px}
ol.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--line)}
ol.tl li{position:relative;margin:0 0 14px 18px;padding:10px 12px;background:var(--card);border-radius:10px}
ol.tl li::before{content:"";position:absolute;left:-28px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--acc)}
ol.tl li.nt::before{background:var(--line)}
.t{font-weight:800;color:var(--acc);margin-right:8px}
.nt .t{color:var(--mute)}
.n{font-weight:700}
.d{color:var(--mute);font-size:.92rem;margin-top:2px}
.tbd{display:inline-block;margin-top:6px;margin-right:6px;padding:1px 9px;border-radius:6px;background:var(--warnbg);color:var(--warn);font-size:.85rem;font-weight:600}
.card{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.card p{margin:2px 0}
ul.ck{list-style:none;margin:0;padding:0}
li.chk{background:var(--card);border-radius:10px;margin-bottom:8px}
li.chk label{display:flex;gap:10px;padding:10px 12px;cursor:pointer}
li.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok);flex:none}
li.chk input:checked+span{text-decoration:line-through;color:var(--mute)}
.prog{color:var(--mute);margin:0 0 12px}
@media (prefers-reduced-motion:no-preference){main>*{animation:f .25s ease-out}@keyframes f{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>
<header>
<h1>胡志明</h1>
<p class="sub">2026/12/1（二）– 12/5（六）　台北往返</p>
<span class="count" id="cd" hidden></span>
</header>
<nav id="nav" role="tablist"></nav>
<main id="main"></main>
<script>
var DAYS=[
{d:"12/1（二）",h:"抵達日",i:[
["07:40","搭機 JX711","台北 T2 → 胡志明 T2，10:30 抵達"],
["12:30","到飯店寄行李","境飯店 Thai Van Lung；入住時間未寫",["入住時間"]],
["13:00","午餐：Phở Chào","炸牛肉河粉"],
["14:30","郵政局、書街"],
["","Ivoire Pastry Boutique","甜點店，營業 10:30–19:00，需在 19:00 前到",["時間"]],
["","G360 Spa 按摩","飯店附近",["預約時間"]],
["19:30","晚餐：Le Jardin","飯店附近法餐，營業 17:30–21:00",["是否已訂位"]]]},
{d:"12/2（三）",h:"一日遊",i:[
["07:00","一日遊集合","",["行程名稱","集合地點","旅行社與訂單","費用與包含項目"]],
["19:00","返回市區","約 19:00"],
["","晚餐：Pho Quynh","河粉",["時間"]],
["","按摩：Nola Spa","",["預約時間"]]]},
{d:"12/3（四）",h:"逛街與咖啡",i:[
["","早餐","飯店早餐，或飯店旁 Pizza 4P's Le Thanh Ton",["擇一","是否訂位"]],
["","11 Garmentory","最大間的選物店",["時間"]],
["","粉紅教堂（新定教堂）","",["時間"]],
["","咖啡廳 4 選 1","ngâm CAFE（麵包咖啡）、Blue Dream Bread Saigon、Cộng Coffee、Nhà Ba Teria（像峽谷的咖啡廳）",["決定哪一間"]],
["","Rose Spa DAKAO 按摩","",["預約時間"]],
["","晚餐：Mùa Craft Saké","清酒吧",["時間","是否訂位"]],
["","酒吧：Summer Experiment","",["時間"]]]},
{d:"12/4（五）",h:"悠閒日",i:[
["","飯店早餐、游泳池","整裝後再出門"],
["","Little HaNoi Egg Coffee（Ky Con）","越南蛋咖啡",["時間"]],
["","逛街買買","",["地點與時間"]],
["","Bánh Mì Huynh Hoa","越南法國麵包",["時間"]],
["","Sả Spa & Onsen","",["預約時間"]],
["","晚餐：SÂM Saigon","大學同學的酒吧",["時間","是否訂位"]]]},
{d:"12/5（六）",h:"返程日",i:[
["","早餐、整理退房","",["退房時間"]],
["","喝抹茶","",["店名","時間"]],
["","按摩","",["店名","預約時間"]],
["15:00","出發前往機場","",["交通方式"]],
["18:00","搭機 JX714","胡志明 T2 → 台北 T2，22:20 抵達"]]}
];
var TODO=[
"Day 2 一日遊：行程名稱、集合地點、旅行社與訂單編號、費用、包含項目",
"Day 5：抹茶與按摩的店名和時間、退房時間",
"飯店：入住時間、訂房編號、完整中文名稱",
"所有按摩的預約時間（G360、Nola、Rose Spa、Sả Spa、Day 5）",
"Day 3、Day 4 各項預計時間",
"訂位狀態：Pizza 4P's、Le Jardin、SÂM Saigon、Mùa Craft Saké",
"E-visa 是否已核准並列印",
"Day 3 早餐與咖啡廳 4 選 1",
"Day 5 回程往機場的交通方式",
"行程 PDF 封面的「香港」字樣是否要改"
];
var done=[];
try{done=JSON.parse(localStorage.getItem("hcm-done")||"[]")}catch(e){done=[]}
function save(){try{localStorage.setItem("hcm-done",JSON.stringify(done))}catch(e){}}
var tabs=["資訊","Day 1","Day 2","Day 3","Day 4","Day 5","待補"],cur=1;
var nav=document.getElementById("nav"),main=document.getElementById("main");
function drawNav(){nav.innerHTML="";tabs.forEach(function(t,k){var b=document.createElement("button");b.textContent=t+(k==6?"（"+(TODO.length-done.length)+"）":"");b.setAttribute("role","tab");b.setAttribute("aria-selected",k==cur);b.onclick=function(){cur=k;draw();window.scrollTo(0,0)};nav.appendChild(b)})}
function draw(){drawNav();main.innerHTML="";
if(cur==0){main.innerHTML='<div class="card"><h3>航班</h3><p>12/1　台北 T2 → 胡志明 T2　JX711　07:40–10:30</p><p>12/5　胡志明 T2 → 台北 T2　JX714　18:00–22:20</p></div><div class="card"><h3>住宿</h3><p>境飯店 Thai Van Lung</p><p>36-38 Thai Van Lung, Ben Nghe Ward, Sai Gon</p></div><div class="card"><h3>簽證</h3><p>E-visa，約 3 個工作天，USD 25。核准後列印，入境時出示。</p></div><div class="card"><h3>機場接送</h3><p>用 Grab。從 A1 出口出來，跨過車道就是停車場；實際上車地點以 App 顯示為準。</p></div><div class="card"><h3>插座</h3><p>越南 220V，A 型與 C 型混用。台灣電器是 110V，建議帶 C 型轉接頭 1–2 個。</p></div>';return}
if(cur==6){var p=document.createElement("p");p.className="prog";p.textContent="已補 "+done.length+" / "+TODO.length+" 項";main.appendChild(p);var u=document.createElement("ul");u.className="ck";TODO.forEach(function(x,k){var l=document.createElement("li");l.className="chk";var lb=document.createElement("label");var c=document.createElement("input");c.type="checkbox";c.checked=done.indexOf(k)>-1;c.onchange=function(){done=done.filter(function(y){return y!==k});if(c.checked)done.push(k);save();p.textContent="已補 "+done.length+" / "+TODO.length+" 項";drawNav()};var s=document.createElement("span");s.textContent=x;lb.appendChild(c);lb.appendChild(s);l.appendChild(lb);u.appendChild(l)});main.appendChild(u);return}
var D=DAYS[cur-1];main.innerHTML='<h2>Day '+cur+'　'+D.h+'</h2><p class="date">'+D.d+'</p>';
var ol=document.createElement("ol");ol.className="tl";
D.i.forEach(function(x){var li=document.createElement("li");if(!x[0])li.className="nt";
var h='<span class="t">'+(x[0]||"時間未定")+'</span><span class="n">'+x[1]+'</span>';
if(x[2])h+='<div class="d">'+x[2]+'</div>';
(x[3]||[]).forEach(function(f){h+='<span class="tbd">待補：'+f+'</span>'});
li.innerHTML=h;ol.appendChild(li)});
main.appendChild(ol)}
var n=Math.ceil((new Date(2026,11,1)-new Date())/864e5),cd=document.getElementById("cd");
if(n>0){cd.textContent="距出發 "+n+" 天";cd.hidden=false}
draw();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
